# Limpieza de un solo uso: quita Polar de Supabase.
#
# Borra las funciones y las claves de Polar, y vuelve a subir las de Payphone
# tal como están en el repositorio. Este archivo se elimina en cuanto ha corrido.

name: Funciones

on:
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar la CLI de Supabase
        run: npm install -g supabase@2.116.0

      - name: Borrar las funciones de Polar
        run: |
          set -uo pipefail
          ref="$(cat supabase/.temp/project-ref)"
          for f in polar-crea polar-confirma polar-webhook; do
            supabase functions delete "$f" --project-ref "$ref" --yes && echo "borrada: $f" || echo "no estaba: $f"
          done

      - name: Borrar las claves de Polar
        run: |
          set -euo pipefail
          supabase secrets unset POLAR_ACCESS_TOKEN POLAR_WEBHOOK_SECRET POLAR_ENTORNO \
            --project-ref "$(cat supabase/.temp/project-ref)" --yes

      - name: Volver a subir las funciones de Payphone
        run: |
          set -euo pipefail
          supabase functions deploy payphone-crea payphone-rescata \
            --no-verify-jwt --use-api --project-ref "$(cat supabase/.temp/project-ref)"

      - name: Comprobar
        run: |
          set -uo pipefail
          base="https://$(cat supabase/.temp/project-ref).supabase.co/functions/v1"
          for f in polar-crea polar-confirma polar-webhook; do
            echo "$f → HTTP $(curl -sS -o /dev/null -w '%{http_code}' "$base/$f")"
          done
          supabase secrets list --project-ref "$(cat supabase/.temp/project-ref)" | grep -i polar \
            && { echo "::error::Quedan claves de Polar"; exit 1; } || echo "Sin claves de Polar."
