# Trae los datos de las competiciones y los sube al servidor.
#
# La app no lleva los resultados dentro: se los descarga de Supabase al
# arrancar. Así este robot puede refrescarlos cada día sin que haya que
# recompilar ni volver a publicar la web, y sin que nadie toque nada.
#
# ── Secretos que hay que poner en GitHub ────────────────────────────────────
#   Settings → Secrets and variables → Actions → New repository secret
#
#   APIFOOTBALL_KEY             la clave de API-Football, para las ligas que la
#                               piden (sudamericanas, copas nacionales…)
#   SUPABASE_URL                https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   la clave de servicio del proyecto. Es la única
#                               que puede escribir en Storage, y por eso vive
#                               aquí y NUNCA en la app.

name: Datos

on:
  schedule:
    # ── Dos ritmos, y la diferencia es el margen ──────────────────────────
    #
    # La pasada completa pide el acta de cada partido de 36 competiciones y
    # tarda horas. Si se lanzara a media mañana, los datos nuevos aterrizarían
    # con los partidos ya empezados y los picks del día llegarían tarde: un
    # pick que aparece en el minuto 20 no sirve para nada.
    #
    # Por eso va de madrugada, con la jornada anterior cerrada y muchas horas
    # por delante antes de que ruede el primer balón.
    - cron: '0 1 * * *'
    #
    # Y entre medias, pasadas ligeras cada cuatro horas: sin actas, solo
    # resultados, calendario y cuotas. Terminan en minutos y mantienen al día
    # lo que cambia durante la jornada —horarios, aplazamientos, marcadores—
    # sin volver a pedir lo que ya se bajó de madrugada.
    - cron: '0 5,9,13,17,21 * * *'
  # Y a mano, desde la pestaña Actions, para no esperar al siguiente turno.
  workflow_dispatch:
    inputs:
      completa:
        description: 'Traer también el acta de cada partido (tarda horas)'
        type: boolean
        default: false

jobs:
  importar:
    runs-on: ubuntu-latest
    # Pedir el acta de cada partido de 36 competiciones lleva su rato.
    timeout-minutes: 240

    steps:
      # Lo primero, antes de gastar tres cuartos de hora importando: comprobar
      # que están las claves para subir. Descubrirlo al final significa esperar
      # toda la importación para que te digan que falta un secreto, y volver a
      # esperarla entera después de ponerlo.
      #
      # Nunca imprime el valor. Solo si está y cuántos caracteres tiene, que
      # basta para detectar el error clásico: pegar la clave a medias.
      - name: Comprobar las claves antes de empezar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          FALTA=0
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Falta SUPABASE_URL"; FALTA=1
          else
            echo "SUPABASE_URL presente (${#SUPABASE_URL} caracteres)"
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Falta SUPABASE_SERVICE_ROLE_KEY"; FALTA=1
          else
            echo "SUPABASE_SERVICE_ROLE_KEY presente (${#SUPABASE_SERVICE_ROLE_KEY} caracteres)"
            # Qué clase de clave es, sin enseñarla. La pública y la secreta
            # miden casi lo mismo y viven en la misma página, así que confundir
            # una con otra es el error fácil: el prefijo las distingue.
            case "$SUPABASE_SERVICE_ROLE_KEY" in
              sb_secret_*)
                echo "  tipo: clave secreta — correcta" ;;
              sb_publishable_*|eyJ*anon*)
                echo "::error::Es la clave PÚBLICA. Hace falta la secreta (sb_secret_...)"
                FALTA=1 ;;
              eyJ*)
                echo "  tipo: JWT antiguo (service_role) — debería valer" ;;
              *)
                echo "  tipo: no reconocido. ¿Seguro que es de este proyecto?" ;;
            esac
          fi
          if [ "$FALTA" = "1" ]; then
            echo "Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          fi

          # Y que la clave sirva de verdad, no solo que exista. Se prueba
          # escribiendo un archivo minúsculo, que es exactamente lo que hará el
          # trabajo al final: preguntar por el almacén contesta cosas raras
          # según el tipo de clave, escribir no admite interpretaciones.
          #
          # Van las dos cabeceras a propósito. La pasarela de Supabase enruta
          # por `apikey` y autoriza por `Authorization`; con una sola devuelve
          # 400 aunque la clave sea perfecta, y se busca el fallo donde no está.
          CODIGO=$(curl -sS -o /tmp/r.txt -w '%{http_code}' \
            -X POST "$SUPABASE_URL/storage/v1/object/datos/_comprobacion.txt" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: text/plain" \
            -H "x-upsert: true" \
            --data-binary "ok")
          echo "Supabase responde $CODIGO al escribir"
          if [ "$CODIGO" != "200" ]; then
            echo "::error::La clave no puede escribir en Supabase (HTTP $CODIGO)"
            cat /tmp/r.txt
            exit 1
          fi
          echo "Claves correctas. Adelante con la importación."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Importar resultados y estadísticas
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # De madrugada, la pasada completa. En las demás, la ligera.
          COMPLETA: ${{ github.event.schedule == '0 1 * * *' || inputs.completa }}
        run: |
          set -euo pipefail
          # La lista vive en un archivo pequeño del repositorio. El de datos
          # pesa 70 MB, ya no se versiona y en un checkout limpio no existe:
          # lo crea el propio importador unas líneas más abajo.
          LIGAS=$(node -e "console.log(require('./src/datos/competiciones.json').join(','))")

          if [ "$COMPLETA" = "true" ]; then
            echo "Pasada COMPLETA (con actas) · $LIGAS"
            node scripts/importar.js --ligas "$LIGAS" --detalles 400 --jugadores 40
          else
            # Sin actas: resultados, calendario y cuotas. Minutos, no horas.
            echo "Pasada LIGERA (sin actas) · $LIGAS"
            node scripts/importar.js --ligas "$LIGAS" --detalles 0
          fi

      - name: Resolver escudos y caras de jugador
        # Solo en la pasada completa: las imágenes no cambian cada cuatro horas.
        if: ${{ github.event.schedule == '0 1 * * *' || inputs.completa }}
        # Si falla, no se aborta: unas imágenes que falten no valen perder los
        # resultados del día, que es lo que de verdad importa.
        continue-on-error: true
        run: node scripts/logos.js

      - name: Subir los datos a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # Antes de nada, decir en voz alta qué falta. Sin esto, un secreto sin
          # poner se manifiesta como un curl que revienta en dos segundos con un
          # error críptico, y se pierde la tarde buscando en el sitio
          # equivocado. Nunca se imprime el valor: solo si está o no está.
          FALTA=0
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Falta el secreto SUPABASE_URL"
            FALTA=1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY"
            FALTA=1
          fi
          if [ "$FALTA" = "1" ]; then
            echo "Ponlos en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ ! -s src/datos/importado.json ]; then
            echo "::error::El importador no dejó src/datos/importado.json"
            ls -la src/datos/ || true
            exit 1
          fi

          # Comprimido primero: el JSON baja de ~70 MB a ~4, un 94% menos. Es lo
          # que se descarga la app, y en un móvil con datos esa diferencia es la
          # que decide si la app abre o el usuario se cansa y la cierra.
          gzip -9 -c src/datos/importado.json > importado.json.gz

          echo "sin comprimir: $(du -h src/datos/importado.json | cut -f1)"
          echo "comprimido:    $(du -h importado.json.gz | cut -f1)"

          subir() {
            # `x-upsert` debería sustituir el archivo anterior en vez de fallar
            # por existir. Debería: según la clave y las reglas del almacén, a
            # veces no basta y hay que pedir la actualización explícitamente.
            CODIGO=$(curl -sS -o /tmp/respuesta.txt -w '%{http_code}' \
              -X POST "$SUPABASE_URL/storage/v1/object/datos/$2" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: $3" \
              -H "x-upsert: true" \
              --data-binary @"$1")
            echo "  $2 -> POST $CODIGO"

            if [ "$CODIGO" != "200" ]; then
              echo "  respuesta: $(cat /tmp/respuesta.txt)"
              # PUT es "actualiza el que ya está". Crear y actualizar son
              # permisos distintos, y el archivo se sube todos los días: a
              # partir del segundo, siempre existe.
              echo "  reintento con PUT..."
              CODIGO=$(curl -sS -o /tmp/respuesta.txt -w '%{http_code}' \
                -X PUT "$SUPABASE_URL/storage/v1/object/datos/$2" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: $3" \
                --data-binary @"$1")
              echo "  $2 -> PUT $CODIGO"
            fi

            if [ "$CODIGO" != "200" ]; then
              echo "::error::No se pudo subir $2 (HTTP $CODIGO)"
              cat /tmp/respuesta.txt
              exit 1
            fi
          }

          subir importado.json.gz importado.json.gz application/gzip

          # El archivo sin comprimir NO se sube. Son 74 MB y Supabase rechaza
          # todo lo que pase de 50: devuelve 413 y tumba el trabajo entero
          # cuando el comprimido, que es el que de verdad usa la app, ya había
          # subido bien.
          #
          # Tampoco se pierde nada. Ningún cliente debería bajarse 74 MB
          # pudiendo bajar 4, y quien no sepa descomprimir se queda con los
          # datos que vienen dentro de la app: viejos, pero suficientes para
          # que abra y se vea algo.

      - name: Comprobar que se sirve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          # Que la subida diga 200 no basta: se comprueba que el archivo se
          # descarga, se descomprime y trae competiciones dentro. Uno cortado
          # dejaría la app sin datos hasta el día siguiente.
          #
          # Se verifica el comprimido porque es el que usa la app.
          curl -sS "$SUPABASE_URL/storage/v1/object/public/datos/importado.json.gz" -o /tmp/bajado.gz
          node -e "
            const zlib = require('zlib');
            const fs = require('fs');
            const j = JSON.parse(zlib.gunzipSync(fs.readFileSync('/tmp/bajado.gz')));
            const n = Object.keys(j.competiciones ?? {}).length;
            if (!n) { console.error('El archivo subido no trae competiciones'); process.exit(1); }
            console.log('Verificado:', n, 'competiciones en el servidor');
          "
