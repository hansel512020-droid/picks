# Trae los datos de las competiciones y los sube al servidor.
#
# La app no lleva los resultados dentro: se los descarga de Supabase al
# arrancar. Así este robot puede refrescarlos cada día sin que haya que
# recompilar ni volver a publicar la web, y sin que nadie toque nada.
#
# ── Secretos que hay que poner en GitHub ────────────────────────────────────
#   Settings → Secrets and variables → Actions → New repository secret
#
#   APIFOOTBALL_KEY             la clave de API-Football, para las ligas que la
#                               piden (sudamericanas, copas nacionales…)
#   SUPABASE_URL                https://xxxx.supabase.co
#   SUPABASE_ACCESS_TOKEN       token personal de Supabase (sb_secret NO: es un
#                               `sbp_…`). Se crea en
#                               https://supabase.com/dashboard/account/tokens
#                               y es lo que usa la CLI para escribir en Storage.
#
#   Antes se usaba SUPABASE_SERVICE_ROLE_KEY por API, pero el proyecto pasó al
#   sistema de claves nuevo: las `service_role` (eyJ…) están desactivadas y
#   Storage rechaza las `sb_secret_…` porque intenta leerlas como un JWT
#   ("Invalid Compact JWS"). La única vía que funciona es la CLI, y la CLI se
#   autentica con el access token, no con la clave de servicio.

name: Datos

on:
  schedule:
    # ── Dos ritmos, y la diferencia es el margen ──────────────────────────
    #
    # La pasada completa pide el acta de cada partido de 36 competiciones y
    # tarda horas. Si se lanzara a media mañana, los datos nuevos aterrizarían
    # con los partidos ya empezados y los picks del día llegarían tarde: un
    # pick que aparece en el minuto 20 no sirve para nada.
    #
    # Por eso va de madrugada, con la jornada anterior cerrada y muchas horas
    # por delante antes de que ruede el primer balón.
    - cron: '0 1 * * *'
    #
    # Y entre medias, pasadas ligeras cada cuatro horas: sin actas, solo
    # resultados, calendario y cuotas. Terminan en minutos y mantienen al día
    # lo que cambia durante la jornada —horarios, aplazamientos, marcadores—
    # sin volver a pedir lo que ya se bajó de madrugada.
    - cron: '0 5,9,13,17,21 * * *'
  # Y a mano, desde la pestaña Actions, para no esperar al siguiente turno.
  workflow_dispatch:
    inputs:
      completa:
        description: 'Traer también el acta de cada partido (tarda horas)'
        type: boolean
        default: false

jobs:
  # ── Aquí se publica, y punto ────────────────────────────────────────────────
  #
  # Hasta el 5 de octubre de 2026 el titular era el PC de casa (refrescar.cmd) y
  # esto era solo el respaldo: había un trabajo «turno» que miraba quién había
  # publicado el último y se saltaba la pasada si el PC llevaba menos de 12
  # horas al día. Tenía sentido cuando el PC podía usar SofaScore —xG real y las
  # ligas que ESPN no tiene— y GitHub no.
  #
  # Ya no lo tiene. SofaScore está apagado desde el 30 de septiembre y todo sale
  # de ESPN, así que aquí no se pierde nada; al revés, esta máquina baja 400
  # actas por liga y el PC bajaba 90. Y el PC daba problemas que no daba aquí:
  # se colgó catorce horas el 2 de octubre y trece y media el 5, las dos veces
  # con la tarea de Windows bloqueando las pasadas siguientes.
  #
  # Con el turno quitado, GitHub publica siempre. El PC ya solo guarda la copia
  # de seguridad de quién ha pagado (scripts/respaldo.js), que es lo único que
  # no se puede hacer desde aquí: son datos personales de clientes y este
  # repositorio es público.
  importar:
    # El Ubuntu normal, sin contenedor.
    #
    # Esto corría dentro de `node:20-alpine` creyendo que en musl sí cargaba el
    # binario nativo de curl-cffi-node (el que imita la huella TLS para poder
    # bajar SofaScore). No puede: `curl-cffi-node` 0.1.8 solo publica binarios
    # para linux-x64-gnu, linux-arm64-gnu, macOS y Windows —comprobado con
    # `npm view curl-cffi-node optionalDependencies`—, así que en Alpine no hay
    # nada que cargar y la librería fallaba siempre. Con glibc el binario existe.
    runs-on: ubuntu-latest
    # Pedir el acta de cada partido de 36 competiciones lleva su rato.
    timeout-minutes: 240

    steps:
      # Lo primero, antes de gastar tres cuartos de hora importando: comprobar
      # que están las claves para subir. Descubrirlo al final significa esperar
      # toda la importación para que te digan que falta un secreto, y volver a
      # esperarla entera después de ponerlo.
      #
      # Nunca imprime el valor. Solo si está y cuántos caracteres tiene, que
      # basta para detectar el error clásico: pegar la clave a medias.
      - name: Comprobar el acceso antes de empezar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          # Descubrir al final que falta el token significa esperar toda la
          # importación para que te lo digan. Se comprueba lo primero. Nunca se
          # imprime el valor: solo si está y cuántos caracteres tiene.
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (token personal sbp_...)."
            echo "Créalo en https://supabase.com/dashboard/account/tokens"
            echo "y ponlo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN presente (${#SUPABASE_ACCESS_TOKEN} caracteres)"
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "  tipo: token personal — correcto" ;;
            sb_secret_*|sb_publishable_*|eyJ*)
              echo "::error::Eso es una CLAVE de API, no un access token. Hace falta un sbp_..."
              exit 1 ;;
            *) echo "  tipo: no reconocido, pero se prueba igual" ;;
          esac
          # Y que el token sirva de verdad: la API de gestión responde 200 si es
          # válido. Es la misma credencial con la que la CLI subirá al final.
          CODIGO=$(curl -sS -o /dev/null -w '%{http_code}' \
            https://api.supabase.com/v1/projects \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "API de gestión responde $CODIGO"
          if [ "$CODIGO" != "200" ]; then
            echo "::error::El access token no es válido o no tiene permiso (HTTP $CODIGO)."
            exit 1
          fi
          echo "Acceso correcto. Adelante con la importación."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` exige que el lockfile ya tenga resuelto el binario nativo de
      # curl-cffi-node para esta plataforma (linux-x64-gnu). El lockfile se
      # genera en Windows, donde npm nunca llega a resolver el binario de
      # Linux porque no lo necesita, así que `npm ci` aquí fallaba con
      # "Failed to load native binding for platform: linux-x64-gnu". `npm
      # install` sí resuelve el binario correcto para la maquina donde corre,
      # sea cual sea el lockfile de partida.
      - run: npm install

      # La CLI de Supabase es la que sube a Storage (ver el paso de subida y el
      # comentario de scripts/publicar-datos.js). Se fija a la versión probada
      # en local.
      - name: Instalar la CLI de Supabase
        run: npm install -g supabase@2.116.0

      # ¿Va a poder bajar SofaScore? Se pregunta antes de importar, no después.
      #
      # Son dos cosas: que cargue la librería de TLS (aquí, con glibc, debería)
      # y que SofaScore deje pasar a una IP de GitHub. Si no deja, la
      # importación sigue igual —con lo de ESPN— pero queda dicho en el registro
      # en vez de descubrirse semanas después mirando por qué faltan los xG.
      - name: Comprobar el acceso a SofaScore
        continue-on-error: true
        run: node scripts/probar-sofascore.js

      # El cache de descargas, guardado de una ejecución a la siguiente.
      #
      # Un partido ya terminado no cambia, así que su acta se baja UNA vez y de
      # ahí en adelante se lee de aquí, sin tocar la red (ver http.js y el flag
      # `soloCacheSiExiste`). Sin esto, cada pasada en un runner limpio volvía a
      # descargar temporadas ya cerradas; con esto, el bot solo pide de red lo
      # nuevo —la temporada en curso y lo que viene—. La clave lleva el id de la
      # ejecución para guardar siempre una versión nueva, y `restore-keys`
      # recupera la más reciente: así el cache se va acumulando.
      - name: Cache de descargas (no rebajar temporadas ya cerradas)
        uses: actions/cache@v4
        with:
          path: .cache-datos
          key: datos-cache-${{ github.run_id }}
          restore-keys: |
            datos-cache-

      - name: Importar resultados y estadísticas
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # De madrugada, la pasada completa. En las demás, la ligera.
          COMPLETA: ${{ github.event.schedule == '0 1 * * *' || inputs.completa }}
        run: |
          set -euo pipefail
          # Por si una ejecución anterior se cortó y dejó el cerrojo dentro del
          # cache restaurado: se quita, que si no el importador se niega a correr.
          rm -f .cache-datos/importando.lock
          # La lista vive en un archivo pequeño del repositorio. El de datos
          # pesa 70 MB, ya no se versiona y en un checkout limpio no existe:
          # lo crea el propio importador unas líneas más abajo.
          LIGAS=$(node -e "console.log(require('./src/datos/competiciones.json').join(','))")

          if [ "$COMPLETA" = "true" ]; then
            # Sin SofaScore desde el 2026-09-30, igual que el PC: dos semanas de
            # bloqueos hacían que la calidad cambiara de una pasada a otra —unas
            # ligas con xG medido y otras sin él— y esa lotería es peor que no
            # tenerlo. Cuesta el 12,6% de los picks (pases y entradas, que ESPN
            # no da por jugador). Vuelve añadiendo --sofascore-red, después de
            # comprobar con `node scripts/probar-sofascore.js`.
            echo "Pasada COMPLETA (con actas) · $LIGAS"
            node scripts/importar.js --ligas "$LIGAS" --detalles 400 --jugadores 40
          else
            # Sin actas: resultados, calendario y cuotas. Minutos, no horas.
            echo "Pasada LIGERA (sin actas) · $LIGAS"
            node scripts/importar.js --ligas "$LIGAS" --detalles 0
          fi

      - name: Resolver escudos y caras de jugador
        # Solo en la pasada completa: las imágenes no cambian cada cuatro horas.
        if: ${{ github.event.schedule == '0 1 * * *' || inputs.completa }}
        # Si falla, no se aborta: unas imágenes que falten no valen perder los
        # resultados del día, que es lo que de verdad importa.
        continue-on-error: true
        run: node scripts/logos.js

      - name: Subir los datos a Supabase
        env:
          # La CLI se autentica con el token; no toca la service_role.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # El script lee el URL solo como respaldo; el proyecto ya viene
          # enlazado en el checkout (supabase/.temp/ está versionado).
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail

          if [ ! -s src/datos/importado.json ]; then
            echo "::error::El importador no dejó src/datos/importado.json"
            ls -la src/datos/ || true
            exit 1
          fi

          # La subida va por la CLI, no por la API. El proyecto pasó al sistema
          # de claves nuevo: las service_role (eyJ…) están desactivadas y
          # Storage rechaza las sb_secret_… porque las lee como un JWT. La CLI,
          # con el access token y el proyecto ya enlazado (supabase/.temp/ está
          # en el repo), sí escribe. El script comprime, parte los datos en
          # núcleo + detalle y sube los tres archivos que usa la app.
          node scripts/publicar-datos.js

          # El catálogo de escudos y caras, si esta pasada lo ha regenerado.
          # Va suelto y sin comprimir: son unos cientos de kB de direcciones, y
          # cambia mucho menos que los resultados.
          if [ -s src/datos/logos.json ]; then
            echo "Subiendo logos.json…"
            supabase storage rm ss:///datos/logos.json --experimental --yes || true
            supabase storage cp src/datos/logos.json ss:///datos/logos.json \
              --content-type application/json \
              --cache-control "public, max-age=300" \
              --experimental --yes
          else
            echo "(sin catálogo de imágenes en esta pasada)"
          fi

      # Los picks ya cocinados, uno por fila en la base de datos.
      #
      # Es lo que hace que un pick de pago no salga del servidor: el permiso de
      # la tabla mira los derechos del usuario y le entrega solo lo suyo. Lo
      # hace quien importa, así que va aquí igual que en el PC.
      #
      # Si falla no se aborta: los datos ya están publicados y la app sigue
      # funcionando con los picks de la pasada anterior.
      - name: Cocinar y publicar los picks
        continue-on-error: true
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          npx esbuild scripts/publicar-picks.ts --bundle --platform=node --format=cjs \
            --tsconfig=tsconfig.json --outfile=node_modules/.cache/publicar-picks.cjs --log-level=error
          node --max-old-space-size=4096 node_modules/.cache/publicar-picks.cjs

      - name: Comprobar que se sirve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # La clave secreta del proyecto (`sb_secret_…`). Hace falta desde que
          # el almacén dejó de ser público: la ruta `/object/public/` ya no
          # sirve nada y esta comprobación fallaría siempre. Si el secreto no
          # está puesto, se prueba igual por la ruta pública y no se rompe nada.
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Que la subida diga 200 no basta: se comprueba que el archivo se
          # descarga, se descomprime y trae competiciones dentro. Uno cortado
          # dejaría la app sin datos hasta el día siguiente.
          #
          # Se verifica el comprimido porque es el que usa la app.
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            curl -sSf "$SUPABASE_URL/storage/v1/object/datos/importado.json.gz" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              -H "apikey: $SUPABASE_SECRET_KEY" -o /tmp/bajado.gz
          elif curl -sSf "$SUPABASE_URL/storage/v1/object/public/datos/importado.json.gz" -o /tmp/bajado.gz; then
            echo "Comprobado por la ruta pública."
          else
            # El almacén ya no es público y no hay clave secreta puesta: no se
            # puede comprobar, pero la subida sí fue bien (el paso anterior lo
            # habría cantado). Se avisa y se sigue: hacer fallar todo el
            # workflow por no poder mirar sería peor que no mirar.
            echo "::warning::No se pudo descargar para verificar. Pon el secreto SUPABASE_SECRET_KEY (sb_secret_… del panel de Supabase) para que esta comprobación vuelva a funcionar."
            exit 0
          fi
          node -e "
            const zlib = require('zlib');
            const fs = require('fs');
            const j = JSON.parse(zlib.gunzipSync(fs.readFileSync('/tmp/bajado.gz')));
            const n = Object.keys(j.competiciones ?? {}).length;
            if (!n) { console.error('El archivo subido no trae competiciones'); process.exit(1); }
            console.log('Verificado:', n, 'competiciones en el servidor');
          "
